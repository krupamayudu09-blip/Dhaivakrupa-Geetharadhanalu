[build]
  command = "node build.js"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"   # bundles the JSON imports (daily-verses.json, youtube_app.json) and web-push into the functions

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
