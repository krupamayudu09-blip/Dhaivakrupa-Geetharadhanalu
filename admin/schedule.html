<!doctype html>
<html lang="te"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Schedule — Dhaivakrupa Admin</title>
<style>
:root{--ink:#17305c;--acc:#b8892b;--bg:#f4f5f8;--line:#d9dde6;--ok:#1b7f3b;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,"Noto Sans Telugu",sans-serif;background:var(--bg);color:#1c2333}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;flex:1}header a{color:#f6d98b;text-decoration:none;font-size:.9rem}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:1rem;margin:0 0 10px}
input[type=text],input[type=search],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
ol,ul{list-style:none;margin:10px 0 0;padding:0;max-height:62vh;overflow:auto}
li{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
li .n{width:1.6em;color:#667;text-align:right}li .t{flex:1}li small{display:block;color:#667}
#st{font-size:.9rem;min-height:1.3em}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:#8a5a00}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
#login{grid-column:1/-1}.empty{color:#667;padding:10px 0}
</style></head><body>
<header><h1>📋 Schedule / షెడ్యూల్ — Dhaivakrupa</h1><a href="/admin/">← Content admin</a><a href="/" target="_blank">View site ↗</a></header>
<main>
  <section>
    <h2>Today's schedule / ఈ రోజు షెడ్యూల్</h2>
    <input type="date" id="dt" aria-label="Meeting date" style="margin-bottom:6px">
    <input type="text" id="nm" placeholder="Meeting name, e.g. ఆదివారం ఆరాధన">
    <div class="row"><span id="cnt"></span><button id="clr">🗑 Clear songs</button></div>
    <label class="row" style="margin-top:6px;font-size:.9rem"><input type="checkbox" id="keep"> Keep the meeting name when clearing songs</label>
    <div id="st"></div>
    <ol id="ml"></ol>
  </section>
  <section>
    <h2>Add songs / పాటలు చేర్చండి</h2>
    <input type="search" id="q" placeholder="Search by title, writer or lyrics…">
    <ul id="res"></ul>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSget=(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}},LSset=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let songs=[],byId={},S={name:'',date:'',ids:[],t:0},dirty=false,saving=false,timer=null;
const norm=s=>String(s||'').toLowerCase();
const status=(t,c)=>{const e=$('#st');e.textContent=t;e.className=c||''};

async function load(){
  try{const d=await (await fetch('/data.json',{cache:'no-cache'})).json();songs=d.songs||[]}catch{status('Could not load songs','bad')}
  songs.sort((a,b)=>a.title.localeCompare(b.title,'te'));songs.forEach(x=>byId[x.id]=x);
  await pull(true);renderPick();setInterval(()=>{if(!document.hidden)pull(false)},2000);
}
/* read the shared schedule; picks up songs the client added from the site */
async function pull(first){
  if(dirty||saving)return;
  try{
    const r=await fetch('/api/meeting',{cache:'no-store'});if(!r.ok)return;const d=await r.json();
    if(first||d.t!==S.t){const changed=!first&&JSON.stringify(d.ids)!==JSON.stringify(S.ids);S=d;$('#nm').value=S.name||'';$('#dt').value=S.date||'';render();
      if(changed)status('↻ Updated from the website','warn');else if(first)status('Saved on the server','')}
  }catch{status('Offline','bad')}
}
function render(){
  const l=S.ids.map(id=>byId[id]).filter(Boolean);
  $('#cnt').textContent=l.length+' songs';
  $('#ml').innerHTML=l.length?l.map((x,i)=>`<li><span class="n">${i+1}</span><span class="t">${esc(x.title)}<small>${esc([x.title_en,x.category].filter(Boolean).join(' • '))}</small></span>
    <button data-up="${i}" ${i?'':'disabled'} aria-label="Up">▲</button><button data-dn="${i}" ${i<l.length-1?'':'disabled'} aria-label="Down">▼</button><button data-del="${esc(x.id)}" aria-label="Remove">✕</button></li>`).join(''):'<li class="empty">No songs yet. Search on the right and tap ＋</li>';
  renderPick();
}
function renderPick(){
  const q=norm($('#q').value.trim()),on=new Set(S.ids);
  const r=songs.filter(x=>!q||norm([x.title,x.title_en,x.writer,x.lyrics].join(' ')).includes(q)).slice(0,60);
  $('#res').innerHTML=r.length?r.map(x=>`<li><span class="t">${esc(x.title)}<small>${esc([x.title_en,x.writer].filter(Boolean).join(' • '))}</small></span><button data-add="${esc(x.id)}" ${on.has(x.id)?'disabled':''}>${on.has(x.id)?'✓':'＋'}</button></li>`).join(''):'<li class="empty">No songs found</li>';
}
function change(fn){
  fn();dirty=true;render();status('Saving…','warn');clearTimeout(timer);timer=setTimeout(save,250);
}
let idP=null;
function idLoad(){if(window.netlifyIdentity)return Promise.resolve(window.netlifyIdentity);
  return idP||(idP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://identity.netlify.com/v1/netlify-identity-widget.js';sc.onload=()=>window.netlifyIdentity?res(window.netlifyIdentity):rej();sc.onerror=()=>{idP=null;rej()};document.head.appendChild(sc)}))}
async function token(force){const w=await idLoad();let u=null;for(let i=0;i<30&&!(u=w.currentUser());i++)await new Promise(r=>setTimeout(r,100));return u?await u.jwt(force):null}
async function save(){
  if(saving){timer=setTimeout(save,300);return}
  saving=true;const body={name:S.name||'',date:S.date||'',ids:S.ids};
  try{
    let r=null;
    for(let k=0;k<2;k++){const t=await token(k===1);if(!t)break;r=await fetch('/api/meeting',{method:'POST',headers:{authorization:'Bearer '+t},body:JSON.stringify(body)});if(r.status!==401)break}
    if(!r||r.status===401)status('Please log in at /admin/ first, then reload this page','bad');
    else if(!r.ok)status('Could not save','bad');
    else{const d=await r.json();S.t=d.t;dirty=false;status('✓ Saved — visible on the website','ok')}
  }catch{status('Offline — will retry','bad');timer=setTimeout(save,4000)}
  saving=false;
}
$('#ml').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.up!==undefined)change(()=>{const i=+d.up;[S.ids[i-1],S.ids[i]]=[S.ids[i],S.ids[i-1]]});
  else if(d.dn!==undefined)change(()=>{const i=+d.dn;[S.ids[i+1],S.ids[i]]=[S.ids[i],S.ids[i+1]]});
  else if(d.del)change(()=>{S.ids=S.ids.filter(x=>x!==d.del)})};
$('#res').onclick=e=>{const b=e.target.closest('button[data-add]');if(b)change(()=>{if(!S.ids.includes(b.dataset.add))S.ids.push(b.dataset.add)})};
$('#q').oninput=renderPick;
$('#nm').oninput=e=>change(()=>{S.name=e.target.value});
$('#dt').onchange=e=>change(()=>{S.date=e.target.value});
$('#keep').checked=LSget('keepname','1')!=='0';
$('#keep').onchange=e=>LSset('keepname',e.target.checked?'1':'0');
$('#clr').onclick=()=>{if(!S.ids.length&&!S.name)return;if(confirm($('#keep').checked?'Remove all songs? The meeting name stays.':'Remove all songs and the meeting name?'))change(()=>{S.ids=[];S.date='';$('#dt').value='';if(!$('#keep').checked){S.name='';$('#nm').value=''}})};
load();
</script></body></html>
